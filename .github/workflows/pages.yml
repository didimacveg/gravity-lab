name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Sin este paso el despliegue falla en unos segundos con
      # "Get Pages site failed": la accion da por hecho que Pages ya esta
      # activado en el repositorio. enablement lo activa por su cuenta.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # El sitio es la carpeta web/ tal cual: no hay paso de compilacion.
      # Se dejan fuera los tests, que no hacen falta en produccion.
      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp -r web/index.html web/simulador.html web/css web/js web/data web/fonts _site/
          if [ -d web/media ]; then cp -r web/media _site/; fi
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/data/horizons_planets.f64

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
