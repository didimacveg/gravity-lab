name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build -j
      - name: Bateria de validacion
        run: ./build/gl_tests
      - name: Benchmark de integradores
        run: ./build/gl_bench
      - uses: actions/upload-artifact@v4
        with:
          name: energy-drift
          path: energy_drift.csv
