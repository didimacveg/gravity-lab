name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The validation suite on two compilers. Physics that only holds on one
  # compiler is not physics, it is undefined behaviour.
  validate:
    name: validation (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j
      - name: Validation suite (conservation, Kepler, precession, stability)
        run: ./build/gl_tests

  # Error-vs-step plots, regenerated on every push so the README figures can
  # always be reproduced from the code that is in the repository.
  convergence:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: Error versus time step
        run: |
          mkdir -p bench/out
          ./build/gl_convergence bench/out/convergence.csv
      - name: Energy drift over 100 years
        run: ./build/gl_bench && mv energy_drift.csv bench/out/
      - name: Plots
        run: |
          pip install matplotlib==3.9.2 numpy==2.1.3
          python bench/plot_convergence.py bench/out/convergence.csv bench/out
          cat bench/out/convergence_slopes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: convergence
          path: bench/out/
